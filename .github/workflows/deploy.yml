name: Publicar en Hostgator

# Cada push a main publica en el subdominio de prueba (staging).
# Producción solo se publica a mano: Actions > Publicar en Hostgator > Run workflow > produccion.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destino:
        description: Dónde publicar
        type: choice
        options: [staging, produccion]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.destino || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.destino || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Evitar que Google indexe el sitio de prueba
        if: ${{ (github.event.inputs.destino || 'staging') == 'staging' }}
        run: |
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          printf '\n<IfModule mod_headers.c>\nHeader set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> site/.htaccess

      - name: Versionar CSS y JS (evita que el navegador use archivos viejos en caché)
        run: |
          V="${GITHUB_SHA::8}"
          find site -name '*.html' -exec sed -i -E "s#((src|href)=\"[^\"?]+\.(js|css))\"#\1?v=$V\"#g" {} +
          grep -rhoE '(src|href)="[^"]+\?v=[^"]+"' site --include=*.html

      - name: Configurar envío de correo por SMTP
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ vars.SMTP_USER || 'citas@rhinolinings.com.mx' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.titan.email' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
        run: |
          if [ -n "$SMTP_PASSWORD" ]; then
            printf '%s' "$SMTP_PASSWORD" | python3 -c "import json,sys,os; print(json.dumps({'host':os.environ['SMTP_HOST'],'port':int(os.environ['SMTP_PORT']),'secure':'ssl','user':os.environ['SMTP_USER'],'pass':sys.stdin.read()}))" > site/api/.htsmtp
            echo "SMTP configurado para $SMTP_USER"
          else
            echo "::warning::Sin secreto SMTP_PASSWORD: las citas se enviarán con mail() del servidor."
          fi

      - name: Configurar Google Sheets
        env:
          SHEETS_URL: ${{ secrets.SHEETS_URL }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: |
          if [ -n "$SHEETS_URL" ]; then
            python3 -c "import json,os; print(json.dumps({'url':os.environ['SHEETS_URL'].strip(),'token':os.environ.get('SHEETS_TOKEN','').strip()}))" > site/api/.htsheets
            echo "Google Sheets configurado"
          else
            echo "Sin SHEETS_URL: las citas no se envían a Google Sheets."
          fi

      - name: Subir archivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
